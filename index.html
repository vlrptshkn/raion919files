<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Флаг посетителя</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    gap: 1px;
  }
  #flag {
    font-size: 15px;
    line-height: 1;
    user-select: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #region {
    font-size: 7px;
    line-height: 1.1;
    color: #ffffff;
    text-shadow: 0 0 2px #000, 0 1px 2px #000;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    opacity: 0;
    transition: opacity 0.3s;
    user-select: none;
    padding: 0 2px;
  }
</style>
</head>
<body>
  <span id="flag"></span>
  <span id="region"></span>

<script>
(function() {
  var flagEl = document.getElementById('flag');
  var regionEl = document.getElementById('region');

  var regionText = '';
  var timeZone = 'UTC';   
  var showingTime = false;
  var timerId = null;

  function codeToFlag(code) {
    if (!code || code.length !== 2) return '';
    code = code.toUpperCase();
    var base = 0x1F1E6;
    return String.fromCodePoint(
      base + (code.charCodeAt(0) - 65),
      base + (code.charCodeAt(1) - 65)
    );
  }

  function getTime() {
    try {
      var fmt = new Intl.DateTimeFormat('ru-RU', {
        timeZone: timeZone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      return fmt.format(new Date());
    } catch (e) {
      
      var d = new Date();
      var h = String(d.getHours()).padStart(2, '0');
      var m = String(d.getMinutes()).padStart(2, '0');
      return h + ':' + m;
    }
  }

  function render() {
    regionEl.textContent = showingTime ? getTime() : regionText;
  }

  function startToggle() {
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function() {
      showingTime = !showingTime;
      render();
    }, 5000);
  }

  function show(code, region, tz) {
    var f = codeToFlag(code);
    if (!f) return;

    flagEl.textContent = f;
    flagEl.style.opacity = '1';

    regionText = region || '';
    timeZone = tz || 'UTC';

    showingTime = false;
    render();
    regionEl.style.opacity = '1';

    startToggle();
  }

  fetch('https://ipapi.co/json/')
    .then(function(r) {
      if (!r.ok) throw new Error('fail');
      return r.json();
    })
    .then(function(d) {
      var reg = d.region || d.city || '';
      show(d.country_code, reg, d.timezone);
    })
    .catch(function() {
      fetch('https://ipwho.is/')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var reg = d.region || d.city || '';
          show(d.country_code, reg, d.timezone && d.timezone.id);
        })
        .catch(function() {});
    });
})();
</script>
</body>
</html>
