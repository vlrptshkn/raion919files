<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Флаг посетителя</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #line {
    font-size: 13px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 0 2px #000, 0 1px 2px #000;
    white-space: nowrap;
    user-select: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  @media (min-width: 768px) {
    #line { font-size: 15px; }
  }
</style>
</head>
<body>
  <span id="line"></span>

<script>
(function() {
  var el = document.getElementById('line');
  var region = '';
  var tz = 'UTC';
  var showTime = false;

  function codeToFlag(code) {
    if (!code || code.length !== 2) return '';
    code = code.toUpperCase();
    var base = 0x1F1E6;
    return String.fromCodePoint(
      base + (code.charCodeAt(0) - 65),
      base + (code.charCodeAt(1) - 65)
    );
  }

  function timeStr() {
    try {
      var fmt = new Intl.DateTimeFormat('ru-RU', {
        timeZone: tz,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
      return fmt.format(new Date());
    } catch (e) {
      var d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' +
             String(d.getMinutes()).padStart(2, '0');
    }
  }

  function render() {
    el.textContent = flag + (showTime ? timeStr() : region);
  }

  var flag = '';

  function setData(code, reg, zone) {
    flag = codeToFlag(code);
    region = reg || '';
    tz = zone || 'UTC';
    showTime = false;
    render();
    el.style.opacity = '1';
  }

  setInterval(function() {
    showTime = !showTime;
    render();
  }, 5000);

  fetch('https://ipapi.co/json/')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      setData(d.country_code, d.region || d.city, d.timezone);
    })
    .catch(function() {
      fetch('https://ipwho.is/')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          setData(d.country_code, d.region || d.city, d.timezone && d.timezone.id);
        })
        .catch(function() {});
    });
})();
</script>
</body>
</html>
