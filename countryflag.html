<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Флаг посетителя</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
  }
  #flag {
    font-size: 22px;
    line-height: 1;
    user-select: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>
  <span id="flag"></span>

<script>
(function() {
  var flagEl = document.getElementById('flag');

  function codeToFlag(code) {
    if (!code || code.length !== 2) return '';
    code = code.toUpperCase();
    var base = 0x1F1E6;
    return String.fromCodePoint(
      base + (code.charCodeAt(0) - 65),
      base + (code.charCodeAt(1) - 65)
    );
  }

  fetch('https://ipapi.co/json/')
    .then(function(r) {
      if (!r.ok) throw new Error('fail');
      return r.json();
    })
    .then(function(d) {
      var f = codeToFlag(d.country_code);
      if (f) {
        flagEl.textContent = f;
        flagEl.style.opacity = '1';
      }
    })
    .catch(function() {
      fetch('https://ipwho.is/')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var f = codeToFlag(d.country_code);
          if (f) {
            flagEl.textContent = f;
            flagEl.style.opacity = '1';
          }
        })
        .catch(function() {});
    });
})();
</script>
</body>
</html>
